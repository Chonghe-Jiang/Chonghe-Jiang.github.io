<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#89939a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#293641}.label{font-size:23px;font-weight:600}.small{font-size:19px;fill:#61707b}.heading{font-size:27px;font-weight:700;letter-spacing:.3px}.line{fill:none;stroke:#89939a;stroke-width:2.3;marker-end:url(#arrow)}.fine{fill:none;stroke:#bac5cb;stroke-width:2}.blue{fill:#eef4f8;stroke:#9ab6c8;stroke-width:1.6}.rose{fill:#f8eef0;stroke:#caa0a7;stroke-width:1.6}.green{fill:#edf5f1;stroke:#9cbcaf;stroke-width:1.6}</style>
