<title id="title">Chores: optimization paths to competitive equilibrium</title><desc id="desc">A difference-of-convex formulation supports an algorithm converging linearly to exact equilibrium and a smoothed subproblem-free method for approximate equilibrium. Concept diagram.</desc>
<text x="32" y="43" class="heading">Competitive equilibrium for chores</text><text x="32" y="71" class="small">A difference-of-convex perspective</text>
<rect x="33" y="111" width="243" height="80" rx="11" class="blue"/><g text-anchor="middle"><text x="154" y="144" class="label">Chores market</text><text x="154" y="173" class="small">agents + disutilities</text></g>
<path d="M289 151 L343 151" class="line"/>
<rect x="356" y="111" width="331" height="80" rx="11" fill="#f7f4ef" stroke="#c9b99f" stroke-width="1.6"/><g text-anchor="middle"><text x="521" y="144" class="label">Difference-of-convex</text><text x="521" y="173" class="small">unconstrained formulation</text></g>
<path d="M521 194 L521 219 L193 219 L193 251" class="line"/><path d="M521 219 L528 219 L528 251" class="line"/>
<rect x="33" y="260" width="319" height="119" rx="12" class="green"/><rect x="371" y="260" width="316" height="119" rx="12" class="rose"/>
<g text-anchor="middle"><text x="193" y="294" class="label">Exact equilibrium</text><text x="193" y="325" class="small">linear convergence</text><text x="193" y="354" class="small">of the iterates</text><text x="529" y="294" class="label">Approximate equilibrium</text><text x="529" y="325" class="small">smoothing + lightweight</text><text x="529" y="354" class="small">subproblem-free iterations</text></g>
