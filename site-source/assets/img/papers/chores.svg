<title id="title">Chores markets: competitive equilibrium</title><desc id="desc">Original concept diagram. A difference-of-convex formulation gives a linearly convergent algorithm for exact equilibrium and a smoothed, subproblem-free method for approximate equilibrium.</desc>
<text x="28" y="47" class="heading">Chores markets</text><text x="28" y="79" class="sub">DC optimization and lightweight iterations</text><path d="M28 100H772" stroke="#e7e7ea"/>
