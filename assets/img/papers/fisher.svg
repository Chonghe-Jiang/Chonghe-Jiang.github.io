<title id="title">Fisher markets: from prices to exact equilibrium</title><desc id="desc">Buyers and goods define a market. Accelerated price adjustment and a recovery oracle produce exact equilibrium prices. Concept diagram, not performance data.</desc>
<text x="32" y="43" class="heading">Fisher market equilibrium</text><text x="32" y="71" class="small">Accelerated prices → exact recovery</text>
<g class="fine"><path d="M108 127 L312 123 M108 127 L312 210 M108 173 L312 123 M108 173 L312 168 M108 220 L312 168 M108 220 L312 210"/></g>
<g fill="#eaf1f6" stroke="#8ca9bd" stroke-width="2"><circle cx="98" cy="127" r="15"/><circle cx="98" cy="173" r="15"/><circle cx="98" cy="220" r="15"/></g>
<g fill="#f8eef0" stroke="#caa0a7" stroke-width="2"><rect x="303" y="110" width="27" height="27" rx="4"/><rect x="303" y="155" width="27" height="27" rx="4"/><rect x="303" y="200" width="27" height="27" rx="4"/></g>
<text x="65" y="263" class="small">Buyers</text><text x="284" y="263" class="small">Goods</text>
<rect x="401" y="116" width="282" height="126" rx="12" class="green"/>
<g text-anchor="middle"><text x="542" y="154" class="label">Market equilibrium</text><text x="542" y="186" class="small">optimal buyer choices</text><text x="542" y="215" class="small">+ market clearing</text></g>
<path d="M347 172 L386 172" class="line"/>
<rect x="28" y="302" width="211" height="77" rx="10" class="blue"/><rect x="269" y="302" width="183" height="77" rx="10" class="rose"/><rect x="482" y="302" width="211" height="77" rx="10" class="green"/>
<path d="M241 340 L261 340" class="line"/><path d="M454 340 L474 340" class="line"/>
<g text-anchor="middle"><text x="134" y="333" class="label">Accelerated</text><text x="134" y="361" class="small">price adjustment</text><text x="360" y="333" class="label">Recovery</text><text x="360" y="361" class="small">oracle</text><text x="588" y="333" class="label">Exact CE</text><text x="588" y="361" class="small">prices</text></g>
</svg>
