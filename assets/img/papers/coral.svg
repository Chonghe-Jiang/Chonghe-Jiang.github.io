<title id="title">CORAL: autonomous multi-agent evolution</title><desc id="desc">Four autonomous agents exchange discoveries through persistent shared memory. A conceptual illustration.</desc>
<text x="32" y="43" class="heading">CORAL</text><text x="32" y="71" class="small">Autonomous multi-agent evolution</text>

