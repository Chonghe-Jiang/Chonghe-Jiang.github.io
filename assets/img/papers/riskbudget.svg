<style>text{font-family:Arial,sans-serif;fill:#293641}.heading{font-size:26px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px;fill:#61707b}.line{fill:none;stroke:#8b959b;stroke-width:2.4;marker-end:url(#arrow)}.blue{fill:#eef4f8;stroke:#9ab6c8;stroke-width:1.7}.rose{fill:#f8eef0;stroke:#caa0a7;stroke-width:1.7}.green{fill:#edf5f1;stroke:#9cbcaf;stroke-width:1.7}</style><rect width="720" height="420" rx="8" fill="white"/>
<title id="title">Optimized risk-budget allocation</title><desc id="desc">A conceptual diagram: allocate the total risk budget across individual constraints and optimize their budgets jointly with the decisions.</desc>
<text x="32" y="43" class="heading">Joint chance constraints</text><text x="32" y="73" class="small">Optimize how risk is shared across constraints</text>
<rect x="226" y="101" width="268" height="62" rx="12" class="blue"/><text x="360" y="140" class="label" text-anchor="middle">Total risk budget ε</text>
<path d="M360 165 L360 187 L133 187 L133 213" class="line"/><path d="M360 165 L360 213" class="line"/><path d="M360 165 L360 187 L587 187 L587 213" class="line"/>
<rect x="37" y="222" width="192" height="79" rx="11" class="rose"/><rect x="264" y="222" width="192" height="79" rx="11" class="green"/><rect x="491" y="222" width="192" height="79" rx="11" class="blue"/>
<g text-anchor="middle"><text x="133" y="253" class="label">Constraint 1</text><text x="133" y="281" class="small">risk budget ε₁</text><text x="360" y="253" class="label">Constraint 2</text><text x="360" y="281" class="small">risk budget ε₂</text><text x="587" y="253" class="label">Constraint m</text><text x="587" y="281" class="small">risk budget εₘ</text></g>
<text x="360" y="346" class="label" text-anchor="middle">ε₁ + ε₂ + ⋯ + εₘ ≤ ε</text><text x="360" y="383" class="small" text-anchor="middle">Optimize decisions and budgets; preserve safety guarantees.</text>
</svg>
