<rect x="35" y="266" width="191" height="88" rx="12" class="green"/><rect x="494" y="266" width="191" height="88" rx="12" class="blue"/>
<g text-anchor="middle"><text x="130" y="148" class="label">Agent 1</text><text x="130" y="177" class="small">explore · reflect</text><text x="590" y="148" class="label">Agent 2</text><text x="590" y="177" class="small">explore · reflect</text><text x="130" y="303" class="label">Agent 3</text><text x="130" y="332" class="small">explore · reflect</text><text x="590" y="303" class="label">Agent 4</text><text x="590" y="332" class="small">explore · reflect</text></g>
